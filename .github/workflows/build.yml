name: Build CardShop Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        working-directory: cardshop-forge-1.0.0/cardshop_forge
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: cardshop-1.0.0
          path: cardshop-forge-1.0.0/cardshop_forge/build/libs/cardshop-1.0.0.jar
