name: Build CardShop Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build
        working-directory: cardshop-forge-1.0.0/cardshop_forge
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cardshop-1.0.0
          path: cardshop-forge-1.0.0/cardshop_forge/build/libs/cardshop-1.0.0.jar
